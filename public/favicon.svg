<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2d2825; }
      .text { fill: #f0ede8; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f5ede0; }
      .text { fill: #0d0d0d; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="20"/>
  <text class="text" x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" text-anchor="middle">ER</text>
</svg>
