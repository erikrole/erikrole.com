<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2a2a2a; }
      .text { fill: #f5f5f5; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f5f4f0; }
      .text { fill: #1a1a1a; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="20"/>
  <text class="text" x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" text-anchor="middle">ER</text>
</svg>
